<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1A1A18">
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fitcol">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144.png">
  <title>Fitcol — Vuela más alto cada día</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="supabase-config.js"></script>
</head>
<body>
  <div id="auth-root" class="auth-root" style="display:none;"></div>
  <div id="app-shell" class="app" style="display:none;">
    <aside class="sidebar">
      <div class="logo"><span class="logo-fit">FIT</span><span class="logo-col">COL</span></div>
      <div class="logo-tag">Vuela más alto cada día.</div>
      <div id="streak-badge" class="streak-badge"></div>
      <nav>
        <button class="nav-item active" data-view="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          Dashboard
        </button>
        <button class="nav-item" data-view="diet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 2 L7 14 M7 14 a3 3 0 0 0 6 0 L13 6 M10 2 L10 6 M16 2 c2 0 4 2 4 5 v3 a3 3 0 0 1 -3 3 L17 22"/></svg>
          Dieta
        </button>
        <button class="nav-item" data-view="workout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8 v8 M3 10 v4 M18 8 v8 M21 10 v4 M6 12 h12"/></svg>
          Entrenamiento
        </button>
        <button class="nav-item" data-view="progress">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17 L9 11 L13 15 L21 7 M21 7 H15 M21 7 V13"/></svg>
          Progreso
        </button>
        <button class="nav-item" data-view="chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3.5-7.1L21 3l-1 4.5A9 9 0 0 1 21 12z"/><circle cx="9" cy="12" r="0.8" fill="currentColor"/><circle cx="13" cy="12" r="0.8" fill="currentColor"/><circle cx="17" cy="12" r="0.8" fill="currentColor"/></svg>
          Asistente IA
        </button>
        <button class="nav-item" data-view="profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21 a8 8 0 0 1 16 0"/></svg>
          Perfil
        </button>
        <button class="nav-item" data-view="achievements">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 L15 9 L22 9 L17 14 L19 21 L12 17 L5 21 L7 14 L2 9 L9 9 Z"/></svg>
          Mis Logros
        </button>
      </nav>
      <div class="sidebar-footer">
        <div id="user-badge" class="user-badge"></div>
        <button id="theme-toggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="theme-icon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <span id="theme-label">Modo claro</span>
        </button>
      </div>
    </aside>

    <main class="content" id="content"></main>
  </div>

  <nav class="bottom-nav">
    <button class="active" data-view="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Inicio
    </button>
    <button data-view="diet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 2 L7 14 M7 14 a3 3 0 0 0 6 0 L13 6 M10 2 L10 6 M16 2 c2 0 4 2 4 5 v3 a3 3 0 0 1 -3 3 L17 22"/></svg>
      Dieta
    </button>
    <button data-view="workout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8 v8 M3 10 v4 M18 8 v8 M21 10 v4 M6 12 h12"/></svg>
      Entreno
    </button>
    <button data-view="chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3.5-7.1L21 3l-1 4.5A9 9 0 0 1 21 12z"/></svg>
      IA
    </button>
    <button data-view="progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17 L9 11 L13 15 L21 7 M21 7 H15 M21 7 V13"/></svg>
      Progreso
    </button>
    <button data-view="achievements">
      <span class="bottom-streak-icon">🦅</span>
      <span id="streak-count-mobile">0</span>
    </button>
  </nav>

  <div id="toast" class="toast"></div>
  <div id="modal-root"></div>

  <script src="data.js"></script>
  <script src="ai.js"></script>
  <script src="app.js"></script>
  <script src="cloud-sync.js"></script>
  <script src="food-search.js"></script>
  <script src="excel-importer.js"></script>
  <script src="gamification.js"></script>
  <script src="auth.js"></script>
  <script src="install-prompt.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registrado:', reg.scope))
          .catch(err => console.error('SW error:', err));
      });
    }
  </script>
</body>
</html>
